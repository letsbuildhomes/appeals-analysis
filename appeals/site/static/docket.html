<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<link rel="stylesheet" href="{{BASE}}/static/site.css">
<link rel="stylesheet" href="{{BASE}}/static/case.css">
</head>
<body class="case-page">
<a class="skip" href="#main">Skip to the content</a>
<header class="topbar">
  <div class="container">
    <a class="brand" href="{{BASE}}/"><img src="{{BASE}}/static/brand/lbh-logo.svg" alt="Let's Build Homes: Vermont housing appeals data" width="150" height="55"></a>
    <nav aria-label="Site">
      <a href="{{BASE}}/">Overview</a>
      <a href="{{BASE}}/latest/">All appeals</a>
      <a href="{{BASE}}/#about">About the data</a>
    </nav>
  </div>
</header>
<div id="banner" class="banner" role="status" hidden></div>
<main id="main" class="container"></main>

<aside id="reader" class="reader" role="dialog" aria-modal="true" aria-labelledby="reader-title" hidden>
  <div class="reader-head">
    <div>
      <p class="reader-kicker" id="reader-kicker"></p>
      <h2 id="reader-title"></h2>
    </div>
    <button type="button" class="icon-btn" id="reader-close" aria-label="Close the document">✕</button>
  </div>
  <div class="reader-tools" id="reader-tools"></div>
  <div class="reader-body" id="reader-body" tabindex="0"></div>
</aside>
<div id="scrim" class="scrim" hidden></div>

<p id="copied" class="visually-hidden" aria-live="polite"></p>
<script id="page-data" type="application/json">{{DATA}}</script>
<script src="{{BASE}}/static/case.js" data-base="{{BASE}}" data-site="{{SITE_URL}}"></script>
</body>
</html>
