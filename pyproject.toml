[project]
name = "appeals"
version = "0.1.0"
description = "Vermont municipal housing appeals: court decisions to research rows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
appeals = "appeals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "E501", "B905"]
