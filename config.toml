# Settings for the pipeline. Command-line options override these values.
# Each model is named "provider/model". The provider's address, the environment
# variable its key is read from (set it in .env or the shell), its rate limits
# and its prices are in providers/<provider>.json.

[paths]
data = "data"                              # store, PDFs and listing snapshots

[source]
listing_url = "https://www.vtcourts.gov/opinions-decisions?f%5B0%5D=court_division_opinions_library_%3A3"
user_agent = "appeals-analysis/0.1 (research archive; sequential requests)"
pause_seconds = 2.0

# The decision model answers closed questions with probabilities.
[decision]
model = "typesafe/jev-1.14.0"
long_context_tokens = 28000                # dockets over this many estimated tokens use long-context mode

# The reasoning model answers each step's question as JSON.
[reasoning]
model = "deepseek/deepseek-flash"
max_output_tokens = 16000                  # includes a thinking model's hidden reasoning
json_repairs = 2                           # times a malformed reply is sent back for correction
resends = 2                                # times a reply cut off at max_output_tokens, or empty, is sent again unchanged

[run]
workers = 64
budget_usd = 20.0
chars_per_token = 4.0

# Gate thresholds: probabilities from the decision model's scan.
# To be tuned against the reference set.
[thresholds]
# Every follow-up reads one number: the scan's probability of the claim it checks (A7 and C4: "yes"; C2 and C3:
# that the kind is at issue at all, one minus "not at issue"). Below its low bound (`check`, or `other_check` for
# C3) there is no step; from there up to `sure` the step is told the scan was unsure and asked to decide; at
# `sure` or above it is told the scan's reading and asked to confirm or refute it. `sure` also labels every scan
# answer in the claims each call starts with. 0.6 is measured: answers at or above it repeated exactly when the
# same questions were asked twice; below it some changed.
check = 0.3
sure = 0.6
# Scope: a docket goes on to the steps when the scan's chance it is in scope is above this; L1 then checks scope
# with quotes for every docket that goes on. The answer key found real cases scanned between 0.05 and 0.2.
scope = 0.05
counts = 0.5
# Grounds (C): the gate on C1 "yes", low so dockets with arguments are rarely skipped.
grounds = 0.3
# The other kinds of question (C3) flag more often than the judgment standards: follow one up at this
# chance of being at issue. 0.5 lost no case in the answer key and saves about one call per docket.
other_check = 0.5
review = 0.5
# Final decision (C2): low so L5a checks the ending with a quote even when the scan doubts one. At 0.5 a
# remand with a judgment order (scanned 0.12) was never checked.
final = 0.1
stay = 0.5
design = 0.5

# The public site (`make site`): the dashboard, its API and the MCP server, over published releases.
# Every route sits under base_path, so a reverse proxy forwards /appeals/... unchanged.
# allowed_hosts are the Host headers the MCP endpoint accepts ("name" or "name:*" for any port);
# the address the server listens on is added automatically. An empty list turns the check off.
[site]
title = "Vermont municipal housing appeals"
base_path = "/appeals"
public_url = "https://data.letsbuildhomes.org"   # the address page links, citations and MCP links name
host = "0.0.0.0"
port = 8000
allowed_hosts = ["data.letsbuildhomes.org", "192.168.88.3:*", "localhost:*", "127.0.0.1:*"]
